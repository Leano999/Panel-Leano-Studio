<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Leaderboard Like — Overlay</title>
<style>
:root{
  --line:#232B3D;--text:#EDEFF5;--muted:#8792A8;--panel-2:#171E2E;
  --gold:#F2B807;--violet:#8B6BF2;
}
</style>
<style>
  html, body{ background: transparent; overflow: hidden; width: 100vw; height: 100vh; }

  #board{
    position: fixed; top: 40px; right: 40px; width: 300px;
    display: none; flex-direction: column; gap: 16px;
  }

  #rows{
    display:flex; flex-direction:column; gap:16px;
  }

  .head{
    display:flex; align-items:center; gap:10px; margin-bottom: 6px;
    padding: 0 4px;
  } .head .dot{ width:7px;height:7px;border-radius:50%;background:var(--gold); }
  .head span{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2.5px; color: var(--muted); text-transform: uppercase; }

  .row{
    position: relative;
    display:flex; align-items:center; gap:12px;
    background: linear-gradient(100deg, rgba(19,24,38,0.94), rgba(23,30,46,0.94));
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    opacity: 1; transform: none;
    overflow: hidden;
  }

  .row.rank-1{
    padding: 14px 16px;
    border: 1px solid rgba(242,184,7,.55);
    box-shadow: 0 4px 12px rgba(0,0,0,.16);}

  .medal{
    flex-shrink:0; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
  }
  .rank-1 .medal{ width:36px; height:36px; background: radial-gradient(circle, #F2B807, #B8850A); color:#1a1200; font-size:15px; }
  .rank-2 .medal{ background: radial-gradient(circle, #C9D2E0, #8894A8); color:#141824; }
  .rank-3 .medal{ background: radial-gradient(circle, #D98A4E, #A85F2C); color:#1c1206; }
  .rank-other .medal{ background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size:12px; }

  .info{ flex:1; min-width:0; }
  .name{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rank-1 .name{ font-size:16px; }
  .count{
    font-family:'JetBrains Mono',monospace; font-size:11px; color: var(--gold); margin-top:2px;
    display:flex; align-items:center; gap:4px;
  }
  .count svg{ width:11px; height:11px; }
  .rank-2 .count, .rank-3 .count, .rank-other .count{ color: var(--muted); }

  .empty{
    font-family:'Inter',sans-serif; font-size:13px; color: var(--muted);
    text-align:center; padding: 18px 0; opacity: .7;
  }
</style>
</head>
<body>

<div id="board">
  <div class="head"><div class="dot"></div><span>Top Pengirim Like</span></div>
  <div id="rows"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({ transports: ['websocket'] });
  const board = document.getElementById('board');
  const rowsEl = document.getElementById('rows');
  const prevCounts = {}; // for count-up animation between updates

  const HEART = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.7 1.6 7.4 4.3 5.9c2.2-1.2 4.7-.5 6.1 1.3.4.5.9 1 1.6 1 .7 0 1.2-.5 1.6-1 1.4-1.8 3.9-2.5 6.1-1.3 2.7 1.5 3.2 4.8 1.6 7-2.6 3.75-9.3 8.1-9.3 8.1z"/></svg>`;

  const rankClass = (i) => i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
  const medal = (i) => i === 0 ? '👑' : i === 1 ? '2' : i === 2 ? '3' : String(i + 1);

  socket.on('event', (payload) => {
    if(payload.kind === 'leaderboard') render(payload.top);
  });

  function render(top){
    if(!top || top.length === 0){
      board.style.display = 'flex';
      rowsEl.innerHTML = `<div class="empty">Menunggu like pertama…</div>`;
      return;
    }
    board.style.display = 'flex';
    rowsEl.innerHTML = top.map((entry, i) => `
      <div class="row ${rankClass(i)}" style="animation-delay:${i * 0.05}s">
        <div class="medal">${medal(i)}</div>
        <div class="info">
          <div class="name">${escapeHtml(entry.username)}</div>
          <div class="count">${HEART}<span data-count="${entry.username}">${prevCounts[entry.username] ?? 0}</span></div>
        </div>
      </div>
    `).join('');

    top.forEach(entry => animateCount(entry.username, entry.likes));
  }

  function animateCount(username, target){
    const from = prevCounts[username] ?? 0;
    if(from === target){ prevCounts[username] = target; return; }
    const el = rowsEl.querySelector(`[data-count="${cssEscape(username)}"]`);
    if(!el) { prevCounts[username] = target; return; }
    const duration = 400;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const val = Math.round(from + (target - from) * t);
      el.textContent = val;
      if(t < 1) requestAnimationFrame(step);
      else prevCounts[username] = target;
    }
    requestAnimationFrame(step);
  }

  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
