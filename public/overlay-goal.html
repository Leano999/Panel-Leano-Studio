<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;--a:rgba(19,24,38,.94);--b:rgba(23,30,46,.94);--l:rgba(139,107,242,.45);--t:#fff}.goal{position:absolute;left:24px;bottom:24px;width:min(520px,calc(100% - 48px));padding:13px 15px;border:1px solid var(--l);border-radius:14px;background:var(--a);color:var(--t);box-shadow:0 2px 8px #0003;display:none}.head{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.track{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;background:#8b6bf2;transition:width .12s}.neon{--a:rgba(9,12,25,.95);--b:rgba(40,21,74,.95)}.bubble{--a:rgba(255,255,255,.97);--b:rgba(245,247,255,.97);--l:#c9c2ff;--t:#171826}.minimal{--a:rgba(10,13,20,.88);--b:rgba(10,13,20,.88);--l:#ffffff30}.pink{--a:rgba(35,10,25,.95);--b:rgba(80,16,47,.95);--l:#f23d6d99}</style></head><body><div class="goal" id="goal"><div class="head"><span id="title">Like Goal</span><span id="count">0 / 1000</span></div><div class="track"><div class="bar" id="bar"></div></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io({ transports: ['websocket'] });s.on('overlay:settings',x=>document.body.className=x?.theme||'glass');s.on('goal:update',g=>{const e=document.getElementById('goal');if(!g?.enabled){e.style.display='none';return}e.style.display='block';title.textContent=g.title||'Live Goal';count.textContent=`${g.current||0} / ${g.target||1}`;bar.style.width=Math.min(100,(g.current||0)/Math.max(1,g.target||1)*100)+'%'});s.emit('goal:get');</script></body></html>
