<!doctype html><html><head><meta charset="utf-8"><title>Follow + Gift Notifications</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
*{box-sizing:border-box}

/* Container: sekarang SELALU menyusun kartu secara VERTIKAL (column),
   bukan berjajar ke samping lagi. Kartu baru menumpuk ke arah anchor-nya
   dan yang lama "naik" / bergeser menjauh, bukan geser ke kiri-kanan. */
#eventFx{position:fixed;inset:0;pointer-events:none;z-index:50;display:flex;flex-direction:column;align-items:center;gap:12px}
#eventFx.pos-top-center{justify-content:flex-start;padding-top:70px}
#eventFx.pos-center{justify-content:center}
#eventFx.pos-bottom-center{flex-direction:column-reverse;justify-content:flex-start;padding-bottom:110px}

.fx-card{position:relative;min-width:390px;max-width:min(680px,80vw);padding:14px 24px;border-radius:22px;display:flex;align-items:center;gap:16px;color:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.22);opacity:0;will-change:transform,opacity}

.fx-avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:28px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.7);box-shadow:0 0 24px rgba(255,255,255,.25)}
.fx-text{min-width:0;text-align:left}.fx-kicker{font:800 11px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;opacity:.9}.fx-user{font:900 22px 'Space Grotesk',Inter,sans-serif;margin-top:2px;text-shadow:0 3px 14px rgba(0,0,0,.35)}.fx-sub{font:700 13px Inter,sans-serif;opacity:.95;margin-top:3px}
.fx-particle{display:none}
.fx-wings{background:linear-gradient(110deg,#0c1535,#322067 48%,#071c3d);border-color:#25d9ff}
.fx-neon{background:linear-gradient(110deg,#090b18,#3d1850,#101c56);border-color:#8b6bf2}
.fx-cat{background:linear-gradient(110deg,#071d38,#0e4d67,#172046);border-color:#25d9ff}
.fx-treasure{background:linear-gradient(110deg,#35200b,#765016 45%,#3a1908);border-color:#ffd44d}
.fx-rose{background:linear-gradient(110deg,#3b0b1d,#7d214b 48%,#430a2b);border-color:#ff76b7}
.fx-universe{background:linear-gradient(110deg,#24164f,#151044 55%,#050718);border-color:#9b8cff}

/* ---- Efek animasi MASUK — pilih salah satu lewat panel kontrol ---- */
.enter-fade{animation:fxFade .5s cubic-bezier(.21,1.02,.73,1) forwards}
@keyframes fxFade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.enter-bounce{animation:fxBounce .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes fxBounce{0%{opacity:0;transform:scale(.4) translateY(14px)}55%{opacity:1;transform:scale(1.07) translateY(-4px)}80%{transform:scale(.97) translateY(1px)}100%{opacity:1;transform:scale(1) translateY(0)}}

.enter-zoom{animation:fxZoom .45s cubic-bezier(.18,.89,.32,1.24) forwards}
@keyframes fxZoom{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}

.enter-slideRight{animation:fxSlideRight .5s cubic-bezier(.21,1.02,.73,1) forwards}
@keyframes fxSlideRight{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}

.enter-flip{animation:fxFlip .55s cubic-bezier(.21,1.02,.73,1) forwards;transform-style:preserve-3d}
@keyframes fxFlip{from{opacity:0;transform:perspective(700px) rotateX(75deg)}to{opacity:1;transform:perspective(700px) rotateX(0deg)}}

/* ---- Keluar (sama buat semua efek, biar konsisten & tetap halus) ---- */
.leave-anim{animation:fxLeave .38s ease forwards}
@keyframes fxLeave{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.88) translateY(-10px)}}
</style></head><body><div id="eventFx" class="pos-top-center"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({ transports: ['websocket'] });const eventFx=document.getElementById('eventFx');
let settings={enabled:true,followStyle:'wings',giftStyle:'treasure',followEffect:'fade',giftEffect:'bounce',followDuration:4,giftDuration:5,position:'top-center'};
socket.on('overlay:settings',s=>{settings={...settings,...(s?.animations||{})};});
socket.on('event',p=>{if(p&&p.kind==='alert'&&(p.type==='follow'||p.type==='gift')&&settings.enabled)show(p);});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show({type,username,extra}){
  eventFx.className='pos-'+(settings.position||'top-center');
  const style=type==='follow'?(settings.followStyle||'wings'):(settings.giftStyle||'treasure');
  const effect=type==='follow'?(settings.followEffect||'fade'):(settings.giftEffect||'bounce');
  const duration=Math.max(2,Math.min(10,Number(type==='follow'?settings.followDuration:settings.giftDuration)||4));
  const card=document.createElement('div');
  card.className='fx-card fx-'+style;
  const icon=type==='follow'?'✦':style==='rose'?'🌹':style==='universe'?'🌌':'🎁';
  const kicker=type==='follow'?'NEW FOLLOWER':'GIFT MASUK';
  const sub=extra|| (type==='follow'?'Baru saja follow!':'mengirim gift!');
  card.innerHTML='<div class="fx-avatar">'+icon+'</div><div class="fx-text"><div class="fx-kicker">'+kicker+'</div><div class="fx-user">@'+esc(username||'Penonton')+'</div><div class="fx-sub">'+esc(sub)+'</div></div>';
  eventFx.appendChild(card);
  requestAnimationFrame(()=>card.classList.add('enter-'+effect));
  const leaveMs=380;
  setTimeout(()=>{
    card.classList.add('leave-anim');
    setTimeout(()=>card.remove(),leaveMs+60);
  },Math.max(1500,duration*1000-leaveMs));
}
</script></body></html>
