<!doctype html><html><head><meta charset="utf-8"><title>Pesan Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
*{box-sizing:border-box}
#msgFx{position:fixed;left:0;right:0;bottom:90px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:60}
.msg-card{position:relative;min-width:340px;max-width:min(640px,80vw);padding:16px 22px;border-radius:20px;display:flex;align-items:center;gap:16px;color:#fff;background:linear-gradient(110deg,#101426,#232a52 55%,#0c0f22);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 26px rgba(0,0,0,.35);opacity:0;transform:translateY(14px);transition:opacity .22s ease,transform .22s ease}
.msg-card.enter{opacity:1;transform:translateY(0)}
.msg-card.leave{opacity:0;transform:translateY(14px)}
.msg-photo{width:64px;height:64px;border-radius:16px;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.5)}
.msg-text{font:700 16px Inter,sans-serif;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.4)}
</style></head><body>
<div id="msgFx"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ transports: ['websocket'] });
const root = document.getElementById('msgFx');

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

socket.on('event', (p) => {
  if (!p || p.kind !== 'message') return;
  show(p.text, p.image);
});

function show(text, image){
  if (!text && !image) return;
  const card = document.createElement('div');
  card.className = 'msg-card';
  card.innerHTML =
    (image ? `<img class="msg-photo" src="${esc(image)}" onerror="this.remove()">` : '') +
    `<div class="msg-text">${esc(text || '')}</div>`;
  root.appendChild(card);
  requestAnimationFrame(() => card.classList.add('enter'));
  const leaveMs = 300;
  setTimeout(() => {
    card.classList.remove('enter');
    void card.offsetWidth;
    card.classList.add('leave');
    setTimeout(() => card.remove(), leaveMs + 80);
  }, 5000);
}
</script>
</body></html>
