<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leano — Chrome Music Player</title>
<style>
body{margin:0;background:#0e111b;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
.box{width:min(720px,92vw);padding:28px;border:1px solid #30374d;border-radius:18px;background:#171c2b}
.title{font-size:20px;font-weight:700}.small{font-size:12px;color:#8f98ad;margin-top:8px}
.status{padding:12px;border-radius:10px;background:#101521;margin:14px 0;color:#b9c0d0}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 16px;border:0;border-radius:10px;background:#8b6bf2;color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#30374d}.btn:disabled{opacity:.5;cursor:not-allowed}
#player{width:100%;height:405px;margin-top:18px;background:#000;border-radius:10px;overflow:hidden}
.ok{color:#8ff0b0}.warn{color:#ffd37a}
</style>
</head>
<body>
<div class="box">
  <div class="title">🎵 Leano Music Player — Chrome</div>
  <div class="small">Halaman ini yang memainkan audio. Biarkan tab ini terbuka saat live.</div>
  <div id="status" class="status warn">⚠️ Klik <b>Aktifkan Audio Chrome</b> sekali sebelum tes request.</div>
  <div class="btns">
    <button id="activate" class="btn">▶ Aktifkan Audio Chrome</button>
    <button id="test" class="btn secondary" disabled>🔊 Tes Audio</button>
  </div>
  <div id="player"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({transports:['websocket']});
let player = null;
let activated = false;
let apiReady = false;
let currentVideoId = null;
let pendingItem = null;
let lastStartedVideoId = null;
let musicVolume = 0.75;

const statusEl = document.getElementById('status');
const activateBtn = document.getElementById('activate');
const testBtn = document.getElementById('test');

function setStatus(text, cls='') {
  statusEl.className = 'status ' + cls;
  statusEl.innerHTML = text;
}

function loadYouTubeApi() {
  if (window.YT && window.YT.Player) {
    if (window.onYouTubeIframeAPIReady) window.onYouTubeIframeAPIReady();
    return;
  }
  if (document.querySelector('script[data-youtube-api]')) return;
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.dataset.youtubeApi = '1';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady = function() {
  if (apiReady) return;
  apiReady = true;
  player = new YT.Player('player', {
    width: '100%',
    height: '405',
    videoId: '',
    playerVars: {
      autoplay: 0,
      controls: 1,
      rel: 0,
      playsinline: 1,
      modestbranding: 1
    },
    events: {
      onReady: function() {
        if (pendingItem && activated) startItem(pendingItem);
      },
      onStateChange: function(e) {
        if (e.data === YT.PlayerState.PLAYING) {
          try { player.setPlaybackQuality('tiny'); } catch(e) {}
          setStatus('🔊 <b>Audio sedang dimainkan dari Chrome · target 144p.</b>', 'ok');
        }
        if (e.data === YT.PlayerState.ENDED && currentVideoId) {
          const id = currentVideoId;
          currentVideoId = null;
          lastStartedVideoId = null;
          socket.emit('music:ended', {videoId:id});
        }
      },
      onError: function() {
        setStatus('❌ YouTube menolak video ini. Mencoba request berikutnya…', 'warn');
        if (currentVideoId) {
          const id = currentVideoId;
          currentVideoId = null;
          lastStartedVideoId = null;
          socket.emit('music:ended', {videoId:id});
        }
      }
    }
  });
};

function startItem(item) {
  if (!item || !item.videoId || !activated) return;
  pendingItem = item;
  currentVideoId = item.videoId;

  if (!apiReady || !player) {
    loadYouTubeApi();
    return;
  }

  if (lastStartedVideoId === item.videoId) return;
  lastStartedVideoId = item.videoId;

  setStatus('⏳ Memulai: <b>' + (item.title || 'Lagu') + '</b> — @' +
            (item.requestedBy || 'Penonton'), '');
  try {
    player.loadVideoById({
      videoId: item.videoId,
      startSeconds: 0,
      suggestedQuality: 'tiny'
    });
    setTimeout(() => { try { player.setPlaybackQuality('tiny'); } catch(e) {} }, 1200);
    player.playVideo();
  } catch (err) {
    setStatus('❌ Gagal menjalankan player Chrome: ' + err.message, 'warn');
  }
}

function render(state) {
  state = state || {};
  const item = state.current || null;

  if (!item) {
    pendingItem = null;
    currentVideoId = null;
    lastStartedVideoId = null;
    if (player && apiReady) {
      try { player.stopVideo(); } catch(e) {}
    }
    if (activated) setStatus('✅ Chrome siap. Menunggu request lagu…', 'ok');
    return;
  }

  pendingItem = item;
  if (activated) startItem(item);
  else setStatus('⚠️ Ada request lagu. Klik <b>Aktifkan Audio Chrome</b> supaya musik boleh diputar.', 'warn');
}

activateBtn.onclick = function() {
  activated = true;
  activateBtn.disabled = true;
  activateBtn.textContent = '✅ Audio Chrome Aktif';
  testBtn.disabled = false;
  setStatus('⏳ Mengaktifkan player…', '');

  loadYouTubeApi();

  // User gesture happens here, so a subsequent unmuted play is allowed by Chrome.
  if (apiReady && player && pendingItem) {
    startItem(pendingItem);
  } else if (!pendingItem) {
    setStatus('✅ Chrome siap. Sekarang kirim !song untuk mengetes.', 'ok');
  }
};

testBtn.onclick = function() {
  if (!activated) return;
  const testItem = {
    videoId: 'dQw4w9WgXcQ',
    title: 'Tes Audio Chrome',
    requestedBy: 'TEST'
  };
  pendingItem = testItem;
  currentVideoId = testItem.videoId;
  lastStartedVideoId = null;
  startItem(testItem);
};

socket.on('connect', function() {
  socket.emit('music:state');
  socket.emit('music:settings:get');
});
socket.on('music:settings', function(settings) {
  musicVolume = Math.max(0, Math.min(1, Number(settings?.volume ?? 0.75)));
  if (player && apiReady) { try { player.setVolume(Math.round(musicVolume * 100)); } catch(e) {}
  try { player.setPlaybackQuality('tiny'); } catch(e) {} }
});
socket.on('music:update', render);

loadYouTubeApi();
</script>
</body>
</html>
